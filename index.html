<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Document Upload</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    form { max-width: 600px; margin: 0 auto; }
    .field { margin-bottom: 10px; }
    label { display: block; margin-bottom: 4px; }
  </style>
</head>
<body>
  <h1>Upload Documents</h1>
  <form id="uploadForm">
    <div class="field">
      <label for="companyName">Company Name (required):</label>
      <input type="text" id="companyName" required>
    </div>
    <div class="field">
      <label for="doc1">Document 1:</label>
      <input type="file" id="doc1">
    </div>
    <div class="field">
      <label for="doc2">Document 2:</label>
      <input type="file" id="doc2">
    </div>
    <div class="field">
      <label for="doc3">Document 3:</label>
      <input type="file" id="doc3">
    </div>
    <div class="field">
      <label for="doc4">Document 4:</label>
      <input type="file" id="doc4">
    </div>
    <div class="field">
      <label for="doc5">Document 5:</label>
      <input type="file" id="doc5">
    </div>
    <div class="field">
      <label for="doc6">Document 6:</label>
      <input type="file" id="doc6">
    </div>
    <div class="field">
      <label for="doc7">Document 7:</label>
      <input type="file" id="doc7">
    </div>
    <div class="field">
      <label for="doc8">Document 8:</label>
      <input type="file" id="doc8">
    </div>
    <button type="submit">Upload</button>
  </form>

  <script>
    // Replace with your Dropbox API access token.
    const ACCESS_TOKEN = "YOUR_DROPBOX_ACCESS_TOKEN";
    // Root folder that will contain all uploaded company folders.
    const ROOT_FOLDER = "/FlightDelayUploads";

    async function createFolder(path) {
      const url = "https://api.dropboxapi.com/2/files/create_folder_v2";
      const res = await fetch(url, {
        method: "POST",
        headers: {
          "Authorization": `Bearer ${ACCESS_TOKEN}`,
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ path })
      });
      if (!res.ok) {
        throw new Error(`Failed to create folder ${path}: ${res.status}`);
      }
      return res;
    }

    async function uploadFile(path, file) {
      const url = "https://content.dropboxapi.com/2/files/upload";
      const res = await fetch(url, {
        method: "POST",
        headers: {
          "Authorization": `Bearer ${ACCESS_TOKEN}`,
          "Dropbox-API-Arg": JSON.stringify({
            path,
            mode: "overwrite",
            mute: true
          }),
          "Content-Type": "application/octet-stream"
        },
        body: file
      });
      if (!res.ok) {
        throw new Error(`Failed to upload ${path}: ${res.status}`);
      }
      return res;
    }

    document.getElementById('uploadForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const companyName = document.getElementById('companyName').value.trim();
      if (!companyName) {
        alert('Company name is required.');
        return;
      }

      // Ensure the root folder exists and then create the company subfolder.
      try {
        await createFolder(ROOT_FOLDER).catch(() => {});
        const baseFolder = `${ROOT_FOLDER}/${companyName}`;
        await createFolder(baseFolder);

      const slots = [
        { id: 'doc1', name: 'Document1' },
        { id: 'doc2', name: 'Document2' },
        { id: 'doc3', name: 'Document3' },
        { id: 'doc4', name: 'Document4' },
        { id: 'doc5', name: 'Document5' },
        { id: 'doc6', name: 'Document6' },
        { id: 'doc7', name: 'Document7' },
        { id: 'doc8', name: 'Document8' }
      ];

      for (const slot of slots) {
        const input = document.getElementById(slot.id);
        const file = input.files[0];
        if (file) {
          const folderPath = `${baseFolder}/${slot.name}`;
          await createFolder(folderPath);
          const filePath = `${folderPath}/${file.name}`;
          await uploadFile(filePath, file);
        }
      }

      alert('Upload complete!');
      e.target.reset();
      } catch (err) {
        console.error(err);
        alert('Upload failed. Check the console for details.');
      }
    });
  </script>
</body>
</html>
